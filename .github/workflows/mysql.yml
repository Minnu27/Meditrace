name: MySQL compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: meditrace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi sqlalchemy 'PyMySQL[rsa]' 'psycopg[binary]' python-dotenv python-multipart pypdf pytest httpx PyJWT cryptography
      - run: python -m pytest -q
        env:
          MYSQL_TEST_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:3306/meditrace_test

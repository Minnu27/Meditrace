[project]
name = "meditrace-ai"
version = "0.1.0"
description = "Evidence-first document ingestion workspace for synthetic and de-identified research data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.1",
  "PyMySQL[rsa]>=1.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
  "PyJWT>=2.8",
  "cryptography>=42",
]

[tool.vercel]
entrypoint = "src.meditrace.api:app"
